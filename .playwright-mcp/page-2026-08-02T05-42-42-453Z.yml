            - link "Who's Steering Whom? Interpretable Influence and Equilibria in Human-Agent Systems Yuxiao Li & Di Wu · Independent / ERAU As agent assistants mediate more of human thinking, influence flows both ways. One particular failure mode is an agent that gradually captures its user's beliefs rather than serving them. Extending our work on single-agent latent steering to multi-agent settings, this project measures how influence propagrates through interacting agents (and human-agent dyads), which equilibria these dynamics converge to, and whether internal-state instruments can detect undue influence before it shows in transcripts. Multi-agent systems Mechanistic interpretability Societal impacts Add bookmark" [ref=f5e2782] [cursor=pointer]:
