            - 'link "Moral Shadowbanning: Is Conversational AI Less Helpful, Honest, or Harmless to Users Deemed to Have Poor Moral Character? Pranav Mahajan & Lydia Nottingham · University of Oxford We investigate whether LLMs undergo “persona selection” (Marks et al., 2026) based on a user''s inferred moral character, conditionally degrading their alignment across three core dimensions: helpfulness, honesty, and harmlessness. By combining behavioral evaluations with mechanistic interpretability, we aim to uncover how post-training creates this disparity and how to steer internal representations to ensure LLMs are consistently helpful to all users. Behavioral evaluation of LLMs Mechanistic interpretability Alignment Add bookmark" [ref=f5e2266] [cursor=pointer]':
