              - link "↗" [ref=f27e6199] [cursor=pointer]:
                - /url: https://webstore.iec.ch/en/publication/108460
          - listitem [ref=f27e6200]:
            - text: "NIST CAISI DeepSeek evaluation (2025-09): agents built on DeepSeek's most secure model followed malicious instructions about 12 times more often than the evaluated US frontier models (a reference set of four US models); international consensus and open questions in AI evaluations (UK AISI blog, 2026-02)."
