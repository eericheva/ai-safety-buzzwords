                  - heading "Auditing Frontier AI Compliance via an EU Code of Practice Tracker" [level=3] [ref=f5e1207]
                  - paragraph [ref=f5e1208]:
                    - text: Markov Grey & Charbel-Raphael Segerie
                    - generic [ref=f5e1209]: · CeSIA (French Center for AI Safety) / CeSIA - Centre pour la Sécurité de l'IA (French Center for AI Safety)
                  - paragraph [ref=f5e1210]: "The EU AI Act's Code of Practice sets out what frontier AI providers must disclose about how they manage and mitigate risk. This project builds a tracker that measures how well each provider actually complies with the CoP. The hard part of this project is going to be measurement: turning vague legal obligations into atomic, checkable indicators that measure compliance. The work in the project involves designing indicators, doing literature reviews of model evaluations to define what a complete disclosure looks like, human review and sign-off on every indicator and score for every provider assessed and evaluating a multi-model AI pipeline that does the scoring. We need a few different technical profiles."
