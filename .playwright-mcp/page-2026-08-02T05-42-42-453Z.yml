            - link "Building a Robust Activation Monitor Davide Baldelli · Mila, MATS Activation monitors, classifiers that detect properties such as deception or harmful intent from a model's internal activations, work well on clean benchmarks and fail under distribution shift, and we believe the failure comes from the training recipe, since today's monitors are linear probes trained on a few thousand examples from one model, one concept, and one narrow distribution. We will train a single monitor across many concepts, many models, and augmented contexts, and evaluate whether it generalizes to concepts and models it never saw. Mechanistic interpretability Evaluations Add bookmark" [ref=f5e577] [cursor=pointer]:
