            - link "Locating the Refusal Circuit in Unified, Encoder-Free Vision-Language Models Alessandro Suglia & Rohit Saxena & Francesco Pinto · University of Edinburgh / Google DeepMind VLMs reliably refuse harmful text prompts but frequently comply with the same intent when it's delivered visually. This is a well-documented \"safety gap\" traced, in modular architectures, to their vision-projector bottleneck. This project asks what happens to that gap in emerging encoder-free, unified VLMs (e.g. Gemma-4-class models) that have no discrete projector to blame and mechanistically locates — and attempts to patch — wherever the failure actually lives. Mechanistic interpretability AI security Behavioral evaluation of LLMs Add bookmark" [ref=f5e1342] [cursor=pointer]:
