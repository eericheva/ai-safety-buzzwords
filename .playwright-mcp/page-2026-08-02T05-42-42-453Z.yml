            - 'link "The Economic Value of AI Capability Gains Pavel Kocourek · University of Barcelona The best open-weight AI models trail the frontier by less than a year, yet frontier labs charge large premiums for marginally better models: casual users barely notice the difference, developers often value it highly, and in offense–defense domains like cybersecurity a small capability edge can be decisive. This project maps how much economic value each level of AI capability unlocks, today and over the next 5–10 years, and what that implies for whether frontier labs can sustain profits against open-weight catch-up. Economics of AI AI strategy Add bookmark" [ref=f5e5029] [cursor=pointer]':
