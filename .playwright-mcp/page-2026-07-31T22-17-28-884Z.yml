    - paragraph [ref=f27e5947]: "Источник цитат: Semantic Scholar Academic Graph API, точная фраза-ключ на тему, статьи 2024-2026, срез 23 июля 2026 (числа воспроизводятся; общее число статей и разбивка по годам получены разными запросами и расходятся не более чем на 7 статей у 19 строк из 53). Пять вертикалей (медицина, транспорт, финансы, энергетика, образование) появились при разрезе прежнего направления Safety in verticals и посчитаны тем же методом, но деньги по ним не разнесены, поэтому они стоят в отдельной денежной полосе. Деньги - оценка профильных трат в долларах за год. Наведи курсор на сумму в колонке \"деньги\" (или на строку в графике): там развернуто, что за деньгами стоит, где [И] - названный источник с суммой (грант, RFP, раунд, поглощение), а [О] - моя прикидка: чаще всего индустриальные траты по размеру команд (профильная команда умножается на загруженную стоимость исследовательницы, примерно $0.5-1M в год), иногда просто признание, что опубликованной цифры нет. Внутренние бюджеты лабораторий не раскрываются, поэтому индустрия всегда [О], и вилка широкая намеренно. Денежный слой проверен отдельно, по каждой сумме: из 46 сумм реестра все 46 стоят на первоисточнике с дословной цитатой - 28 подтвердились как были, 18 оказались неверными и исправлены, непроверяемых не осталось; еще 180 сумм разобраны и не пущены в реестр по объявленному коду. Повествовательный слой сверен той же машиной: из 2200 цитат карточек и эссе 2191 стоят на своей странице дословно, 9 страниц отсюда не читаются - их закрывает бот-защита или они собираются в браузере, и архивного снимка с цитатой к ним не нашлось. Из этого собран реестр подтвержденного: строка подтверждено источником в подсказке показывает, сколько денег стоит за направлением по опубликованным документам, отдельно от моей оценки. Денежные заметки больше не пишутся руками: каждая сумма это запись с обязательными полями (величина, тип периода, окно, природа, доля, адрес источника, дословная цитата), текст заметки рисуется из записей, а маркер [И] вычисляется - сумма становится источником только когда у нее есть и адрес, и цитата. Поэтому величина, период и доля теперь одни на два языка, и расходиться между русским и английским не могут. В реестр не идут валюации, венчурные раунды, цены поглощений, расходы на комплаенс, бюджеты родительских областей, весь бюджет организации и объявленное, но не выплаченное; делить многолетнюю сумму на срок разрешено только если срок опубликован. Итог: выдано и подтверждено $50M в год плюс $103M разово и многолетне против $1173M оценок; сверх того объявлено, но пока не роздано до $34M объявленных потолков - это обещанные размеры программ, а не выданные деньги, и в подтвержденное они не входят. У 33 направлений из 53 подтвержденных денег нет вовсе, и на них приходится 65% всех денег карты - у суммы в колонке денег там стоит знак °. Для масштаба: генеалогический датасет этого же проекта складывает $764M выданных грантов, и это не противоречие, а разные вопросы. Там - вся история поля с 2013 года целиком, без разнесения по направлениям, без годового окна и без правила деления многолетней суммы на срок. Здесь - профильный расход одного направления за год по опубликованным документам. Число на карте меньше не потому, что денег в поле меньше. Две прежние версии этого реестра давали $84M и $143M: правило деления многолетней суммы на срок применялось неровно, и больше половины годовой суммы стояло на внутреннем файле карты без адреса и цитаты. Обязательные поля закрыли и то, и другое. Деньги на этой карте слабее цитат: цитаты воспроизводятся запросом, деньги - нет, и вилка это оценка, а не измерение. 2026 неполный и занижен лагом индексации, поэтому momentum - нижняя оценка. Узкие ключи занижают широкие темы (например оценки опасных способностей). Колонка цит/ст это сумма цитат по ста самым цитируемым статьям, поделенная на число статей, но не более чем на сто. Из-за этого потолка она систематически завышает большие корпуса: у направления на 30 статей делитель 30, у направления на 3000 статей делитель тоже 100, а числитель считается по тем же ста статьям. Сравнивать по этой колонке корректно только строки сопоставимого размера.Маркеры у названия: * - ключ многозначный, число статей завышено смежным (это верхняя оценка внимания по слову, а не чистая safety-релевантность); ^ - ключ сужен до AI/safety и пересчитан вниз; [ф] - тема живет в форумных эссе, и цитируемость ее почти не видит. Маркеры проставлены по той же логике, что в таблице 53 направления в текстовой карте, но построчно эти два списка друг с другом не сверялись."