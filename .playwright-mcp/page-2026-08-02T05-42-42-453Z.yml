                  - heading "Distilling the technical AI safety literature and co-authoring the AI Safety Atlas" [level=3] [ref=f5e3386]
                  - paragraph [ref=f5e3387]:
                    - text: Markov Grey & Charbel-Raphael Segerie
                    - generic [ref=f5e3388]: · CeSIA (French Center for AI Safety) / CeSIA - Centre pour la Sécurité de l'IA (French Center for AI Safety)
                  - paragraph [ref=f5e3389]: The goal is to create the best possible explanation of technical AI safety. We are aiming to explain how many different safety research areas connect together to form a broader technical AI safety strategy. We already have existing draft writeups for domains like reward misspecification, goal misgeneralization and scalable oversight. We want co-authors to both improve the existing writing, and also write new content on multi agent safety, and cybersecurity practices for AI. Initial versions need to be updated using research published in the 2025-2026 timeframe. The output will be published as a standalone paper and also becomes a chapter of the AI Safety Atlas, which is a textbook already being used by thousands of students to learn about AI safety.
