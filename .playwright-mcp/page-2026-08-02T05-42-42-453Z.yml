                  - heading "Mapping and Verifying Multi-Dimensional Compliance in AI Constitutions through Constraint Satisfaction" [level=3] [ref=f5e3441]
                  - paragraph [ref=f5e3442]:
                    - text: Dhairya Dalal & Marco Valentino
                    - generic [ref=f5e3443]: · MATS Research / University of Sheffield
                  - paragraph [ref=f5e3444]: Frontier labs focused on AI safety and alignment are adopting AI constitutions as a means to ensure alignment with codified principles, values, and behavioral specifications. Anthropic’s Claude Constitution (Askell et al., 2026) and OpenAI’s Model Spec (OpenAI, 2026) serve as technical governance resources in post-training alignment (Bai et al., 2022; Guan et al., 2024). AI constitutions are generally long, complex documents that combine behavioral requirements, guiding principles, authority structures, priorities, and exceptions. Jakkli et al. (2026) found that, despite improvements across model generations, violations persist when models must resolve competing requirements and sources of authority, particularly in multi-turn and agentic task settings. This project aims to build upon that line of research to more fundamentally examine existing AI constitution documents, better understand the multi-dimensional requirements they present, and formally classify common failure modes. Specifically, this project aims to (1) create a classification framework to analyze failures in multi-requirement compliance settings, (2) create a benchmark of use cases derived from the framework to evaluate AI compliance, and (3) explore constraint-satisfaction methods for verifying compliance in such settings.
                  - generic [ref=f5e3445]:
                    - generic [ref=f5e3446]: Scalable oversight
                    - generic [ref=f5e3451]: Technical governance
                    - generic [ref=f5e3455]: Evaluations
