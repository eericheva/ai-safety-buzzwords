            - 'link "A Diagnostic Panel of Ground-Truth Probes for Language Models Mohamed Amine Merzouk & Adam Oberman · Mila - Quebec AI Institute & McGill University / McGill Most safety probing starts from a human concept (deception, sandbagging, sycophancy) and hunts for its direction in activation space, inheriting noisy labels and fragile transfer. This project inverts the recipe: we admit only probe targets with exact, computable ground truth, such as remaining response length, end-of-sequence hazard, repetition onset, copy-versus-generate, and format validity. Individually these are calibrated vital signs for a generating model. Jointly, reproducible patterns across the panel define \"conditions\", named for mechanism the way medicine names syndromes from lab values. Mechanistic interpretability Evaluations Add bookmark" [ref=f5e1041] [cursor=pointer]':
