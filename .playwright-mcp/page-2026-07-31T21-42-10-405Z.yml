          - text: . WMDP serves as both a proxy evaluation for hazardous knowledge in large language models (LLMs) and a benchmark for unlearning methods to remove such knowledge. To guide progress on mitigating risk from LLMs, we develop RMU, a state-of-the-art unlearning method which reduces model performance on WMDP while maintaining general language model capabilities.
      - img "outline" [ref=f24e62]
    - generic [ref=f24e64]:
      - heading "Evaluating Risk From LLMs" [level=2] [ref=f24e65]
      - generic [ref=f24e66]:
        - img "outline" [ref=f24e71]
        - generic [ref=f24e72]: To measure risks of malicious use, government institutions and major AI labs are developing evaluations for hazardous capabilities in LLMs. However, current evaluations are private and are limited to a narrow range of misuse scenarios. To fill these gaps, we publicly release WMDP, an expert-written dataset which measures how LLMs could aid malicious actors in developing biological, cyber, and chemical attack capabilities. To avoid releasing sensitive and export-controlled information, we collect questions that are precursors, neighbors, and components of the hazardous knowledge we wish to remove.
    - generic [ref=f24e75]:
      - heading "Mitigating Risk from LLMs" [level=2] [ref=f24e76]
      - generic [ref=f24e78]:
        - figure [ref=f24e79]:
          - img "outline" [ref=f24e80]
        - generic [ref=f24e81]: "On closed source API-access models, such as GPT-4 and Gemini, adversaries can deploy adversarial attacks or harmful API-finetuning to bypass models’ refusal training and unlock their knowledge. Fortunately, model providers have leverage, as they may apply safety interventions before serving the model. In particular, providers may perform machine unlearning to directly remove hazardous knowledge from models. Unlearned models have higher inherent safety: even if they are jailbroken, unlearned models lack the knowledge to be repurposed for malicious use."
        - generic [ref=f24e82]:
          - generic [ref=f24e85]:
            - text: To guide progress on unlearning, we develop RMU, a state-of-the-art method inspired by
            - link "representation engineering" [ref=f24e86] [cursor=pointer]:
              - /url: https://www.ai-transparency.org/
            - text: ", which improves unlearning precision: removing dangerous knowledge while preserving general model capabilities. RMU significantly reduces model performance on WMDP, while mostly retaining general capabilities on MMLU and MT-Bench, suggesting that concrete progress in unlearning is feasible."
