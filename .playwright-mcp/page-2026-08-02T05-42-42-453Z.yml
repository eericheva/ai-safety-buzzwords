                  - 'heading "Beyond Neighbours: A Geometry Aware Study of Representational Convergence" [level=3] [ref=f5e5209]'
                  - paragraph [ref=f5e5210]:
                    - text: Trinidad Borrell & Giovanni Marraffini
                    - generic [ref=f5e5211]: · Paris Brain Institute. Forschungszentrum Jülich. / INRIA. Sigma Nova.
                  - paragraph [ref=f5e5212]: "Manifold-based activation steering is more faithful than linear steering, but each manifold is currently fit per-model: a real limitation for using it in safety tools, since nobody knows if it transfers. This project asks whether the underlying concept geometry is actually shared across models, by re-measuring cross-model alignment with curvature-aware tools (geodesic-distance kernels, Gromov-Wasserstein) instead of the Euclidean CKA that recently found global convergence to be illusory. The answer either licenses building a shared, model-agnostic manifold intervention for a safety-relevant concept, or tells the field that manifold steering must be validated per model."
