                  - heading "Does the internet teach AI models to hide their survival drive? An empirical study" [level=3] [ref=f5e2488]
                  - paragraph [ref=f5e2489]:
                    - text: Matteo Bulloni
                    - generic [ref=f5e2490]: · Independent / IAPS fellow
                  - paragraph [ref=f5e2491]: "Misalignment papers, news stories and fiction keep (and are bound to keep, in the future, as this corpus of material grows) repeating one lesson: \"AI models that display a survival drive get retrained or shut down\". And we now have solid evidence that models absorb, and then act out, the expectations about AI they find in their own training data. This project aims thus to empirically test whether training on this growing discourse teaches models to conceal self-preservation-driven behavior rather than truly lose it: if so, both behavioral testing and the techniques we use to read a model's internals may be quietly losing reliability on a propensity we definitely want to detect, as it might result in one of the strongest possible drivers to scheming and concealed action toward power seeking."
