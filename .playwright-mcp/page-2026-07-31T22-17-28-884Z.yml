  - generic [ref=f27e241]:
    - heading "Задачи внутри направления" [level=2] [ref=f27e12152]
    - paragraph [ref=f27e243]: "Клик по направлению открывает задачи внутри него: по чипу выше, по любому месту строки в графиках или по названию в таблицах. Это не полный реестр, а собранные вручную живые и недавние точки входа: RFP, стажировки, менторские потоки, баунти, воркшопы и опубликованные списки открытых проблем. Всего 324 задачи на 53 направления, распределены они неравномерно: у 6 направлений вход один, у самого крупного 27. Поле, которого нет на странице источника, помечено как \"нет в источнике\", а не додумано. Статус \"закрыт\" значит, что прием заявок закончился, но формулировка задачи осталась опубликованной и годится как отправная точка."
    - generic [ref=f27e244]:
      - generic [ref=f27e12153]:
        - text: Assurance / certification
        - generic [ref=f27e12155]: 4 задач
        - button "закрыть x" [ref=f27e12156] [cursor=pointer]
      - group [ref=f27e12157]:
        - generic "5 вопросов о направлении" [ref=f27e12158] [cursor=pointer]
        - paragraph [ref=f27e12159]: "Как безопасность заверяют извне и как надзирают после деплоя: сертификация, аудит, мониторинг инцидентов, и оценка самих оценок."
        - heading "1. Почему эта тема, как ее объясняют сами компании" [level=5] [ref=f27e12160]
        - paragraph [ref=f27e12161]:
          - text: "Появился слой third-party аудита и сертификации: ISO 42006 стандартизирует, кто вообще имеет право сертифицировать ИИ. NIST CAISI проводит национально значимые evals, а пост UK AISI от 12 февраля 2026 излагает международный консенсус и открытые вопросы по evals, причем про evals в целом, а не про автоматические."
          - superscript [ref=f27e12162]:
            - link "↗" [ref=f27e12163] [cursor=pointer]:
              - /url: https://www.aisi.gov.uk/blog/international-ai-network-consensus-and-open-questions
        - heading "2. Как ее объясняет область, откуда пришел запрос" [level=5] [ref=f27e12164]
        - paragraph [ref=f27e12165]: "Запрос: self-assessment лабораторий недостаточно, нужны аккредитованные органы аудита, единый incident reporting и стандартизированная методология evals (мета-оценка)."
        - heading "3. Почему тема держится и как изменилась" [level=5] [ref=f27e12166]
        - paragraph [ref=f27e12167]:
          - text: "Растет как институциональный слой. Сдвиг: от research-evals к сертификации (ISO 42001/42005/42006 и 25059, который уже в пересмотре), к рейтингам по шкале Poor-Excellent (AILuminate) и к ретроспективному надзору за инцидентами."
          - superscript [ref=f27e12168]:
            - link "↗" [ref=f27e12169] [cursor=pointer]:
              - /url: https://mlcommons.org/benchmarks/ailuminate/
        - heading "4. Есть ли у темы история" [level=5] [ref=f27e12170]
        - paragraph [ref=f27e12171]:
          - text: От NIST AI RMF и добровольных обязательств к аккредитованной сертификации, к OECD AI Incidents Monitor и AIID, к консенсусу по методологии evals (2026).
          - superscript [ref=f27e12172]:
            - link "↗" [ref=f27e12173] [cursor=pointer]:
              - /url: https://www.nist.gov/itl/ai-risk-management-framework
        - heading "5. Куда тема будет развиваться дальше" [level=5] [ref=f27e12174]
        - paragraph [ref=f27e12175]:
          - text: "Прогноз: аккредитованный аудит как норма, единый глобальный incident-reporting (по аналогии с авиацией и фармой), red-teaming самих evals (DEF CON GRT3 ищет дырявые evals, дающие ложную уверенность)."
          - superscript [ref=f27e12176]:
            - link "↗" [ref=f27e12177] [cursor=pointer]:
              - /url: https://aivillage.org/blog/grt3-info/
        - heading "Кто занимается прямо сейчас" [level=5] [ref=f27e12178]
        - paragraph [ref=f27e12179]: ISO/IEC + ANAB/BSI/TUV, NIST CAISI, International Network for Advanced AI Measurement, Evaluation and Science, MLCommons (AILuminate), OECD.AI, AI Incident Database, AI Village (GRT3).
