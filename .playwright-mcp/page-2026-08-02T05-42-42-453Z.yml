            - 'link "Mapping Cost Trajectories of AI-Adjacent Technologies Isaak Mengesha · University of Oxford A core macrostrategic question is whether we can predict — and steer — technological progress to mitigate risk from transformative AI; answering it requires empirical cost-and-performance trajectories for the technologies AI depends on and the technologies AI will transform, which today mostly don''t exist. Mentees will each construct one such trajectory — a longitudinal price-and-specification dataset for an AI-adjacent technology (inputs to AI: accelerators, memory, interconnects, data-center power/cooling; or AI-consuming: robots, lidar, autonomous platforms, sensing) — contributing to the larger effort of establishing a \"Technology Observatory.\" AI strategy Economics of AI Add bookmark" [ref=f5e4080] [cursor=pointer]':
