            - 'link "Does Agency Scale? A Cost-Aware Benchmark for Automated Interpretability Arnau Marin-Llobet · Harvard University Automated interpretability has multiple competing ways to explain what a latent in an LLM encodes — cheap one-shot autointerp, per-latent agents (MAIA/InterpAgent-style), and amortized natural-language autoencoders — but they have never been compared on equal footing. We will build a cost-aware benchmark with known ground truth to answer: when, for which latents, and at what dollar cost does agentic interpretation actually pay? Mechanistic interpretability Evaluations Add bookmark" [ref=f5e2885] [cursor=pointer]':
