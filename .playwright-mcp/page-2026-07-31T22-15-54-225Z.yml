  - generic [ref=f27e241]:
    - heading "Tasks inside a direction" [level=2] [ref=f27e242]
    - paragraph [ref=f27e243]: "Clicking a direction opens the tasks inside it: a chip above, anywhere on its row in the charts, or its name in the tables. This is not a complete registry but a hand-collected set of live and recent entry points: RFPs, fellowships, mentored streams, bounties, workshops and published open-problem lists. 324 tasks across 53 directions, unevenly spread: 6 directions have a single way in, the largest has 27. A field the source page does not state is marked \"not stated in the source\" rather than filled in. Status \"closed\" means applications are over, but the problem statement stays published and still works as a starting point."
    - generic [ref=f27e244]:
      - generic [ref=f27e6159]:
        - text: Assurance / certification
        - generic [ref=f27e6161]: 4 tasks
        - button "close x" [ref=f27e6162] [cursor=pointer]
      - group [ref=f27e6163]:
        - generic "5 questions about the direction" [ref=f27e6164] [cursor=pointer]
        - paragraph [ref=f27e6165]: "How safety is attested from the outside and how it is supervised after deployment: certification, audit, incident monitoring, and evaluation of the evaluations themselves."
        - heading "1. Why this topic, in the labs’ own words" [level=5] [ref=f27e6166]
        - paragraph [ref=f27e6167]:
          - text: "A layer of third-party audit and certification has appeared: ISO 42006 standardizes who is entitled to certify AI at all. NIST CAISI runs nationally significant evals, and a UK AISI post of 12 February 2026 sets out international consensus and open questions in AI evaluations, covering evaluations generally rather than automated ones."
          - superscript [ref=f27e6168]:
            - link "↗" [ref=f27e6169] [cursor=pointer]:
              - /url: https://www.aisi.gov.uk/blog/international-ai-network-consensus-and-open-questions
        - heading "2. How the field the request came from explains it" [level=5] [ref=f27e6170]
        - paragraph [ref=f27e6171]: "The request: labs' self-assessment is not enough, you need accredited auditors, unified incident reporting and a standardized evaluation methodology (meta-evaluation)."
        - heading "3. Why it holds and how it changed" [level=5] [ref=f27e6172]
        - paragraph [ref=f27e6173]:
          - text: "Growing as an institutional layer. The shift: from research-evals to certification (ISO 42001/42005/42006 and 25059, itself already under revision), to Poor-to-Excellent ratings (AILuminate) and to retrospective oversight of incidents."
          - superscript [ref=f27e6174]:
            - link "↗" [ref=f27e6175] [cursor=pointer]:
              - /url: https://mlcommons.org/benchmarks/ailuminate/
        - heading "4. Does the topic have a history" [level=5] [ref=f27e6176]
        - paragraph [ref=f27e6177]:
          - text: From NIST AI RMF and voluntary commitments to accredited certification, to the OECD AI Incidents Monitor and AIID, to a consensus on evaluation methodology (2026).
          - superscript [ref=f27e6178]:
            - link "↗" [ref=f27e6179] [cursor=pointer]:
              - /url: https://www.nist.gov/itl/ai-risk-management-framework
        - heading "5. Where the topic goes next" [level=5] [ref=f27e6180]
        - paragraph [ref=f27e6181]:
          - text: "Forecast: accredited audit as the norm, unified global incident reporting (by analogy with aviation and pharma), red teaming of the evaluations themselves (DEF CON GRT3 looks for leaky evals that give false confidence)."
          - superscript [ref=f27e6182]:
            - link "↗" [ref=f27e6183] [cursor=pointer]:
              - /url: https://aivillage.org/blog/grt3-info/
        - heading "Who works on it right now" [level=5] [ref=f27e6184]
        - paragraph [ref=f27e6185]: ISO/IEC + ANAB/BSI/TUV, NIST CAISI, International Network for Advanced AI Measurement, Evaluation and Science, MLCommons (AILuminate), OECD.AI, AI Incident Database, AI Village (GRT3).
