            - link "Investigating Model Internal Verbalizers Dennis Akar · Aether This is an emerging paradigm of training language models (verbalizer) to describe the internals of other language models (target) in natural language (e.g. Anthropic's Natural Language Autoencoders). They generalize well; for instance, they can recover hidden behaviours from models trained to conceal them, achieve SOTA on AuditBench, and can verbalize backdoor triggers where prior methods failed. However, there remain open questions regarding their faithfulness, calibration, input generality, and effect on intrinsic interpretability. Let's try to answer them. Mechanistic interpretability Evaluations Add bookmark" [ref=f5e2111] [cursor=pointer]:
