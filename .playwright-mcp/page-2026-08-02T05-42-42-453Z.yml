            - link "Mitigating Intentional Loss of Control Risk Through Interoperability Standards for Agentic AI Kevin Kohler · Simon Institute, UN University, AGI Preparedness Institute Within a few years, when self-replication is plausibly within reach of open-weight systems, the binding constraint on an agent deployed to operate without a controlling human principal will likely not be the model, but whether the rest of the agent economy will discover, authorize, transact with, or pay it. This project maps who actually holds change control over the agent identity and trust layer, evaluates the competing architectures against an explicit intentional-loss-of-control threat model, and feeds the result into live standards and Geneva policy discussions before network effects settle the question. AI control International governance Technical governance Add bookmark" [ref=f5e669] [cursor=pointer]:
