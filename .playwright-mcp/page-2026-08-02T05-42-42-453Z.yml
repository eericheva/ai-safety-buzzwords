            - link "Investigate verbalized evaluation awareness as a function of eval environment realism Ezra Newman · Apollo Research We would investigate how verbalized evaluation awareness (VEA) changes as a function of scenario realism. Ideally we would show that for very toy environments VEA is low (because the model does not need to verbalize it's eval awareness), then VEA rises as you make the environment more realistic (the model needs to verbalize to reason about it) and then falls as the environment becomes indistinguishable from production traffic. I am most excited about mentoring fellows who would like to work at Apollo Research if the fellowship goes exceptionally well. Add bookmark" [ref=f5e1562] [cursor=pointer]:
