        - heading "Результаты" [level=5] [ref=f27e12189]
        - list [ref=f27e12190]:
          - listitem [ref=f27e12191]:
            - text: ISO 42006:2025 (требования к органам сертификации ИИ); 42005:2025 (impact assessment).
            - superscript [ref=f27e12192]:
              - link "↗" [ref=f27e12193] [cursor=pointer]:
                - /url: https://webstore.iec.ch/en/publication/108460
          - listitem [ref=f27e12194]:
            - text: "NIST CAISI DeepSeek evaluation (2025-09): агенты на самой защищенной модели DeepSeek примерно в 12 раз чаще следовали вредным инструкциям, чем оцененные американские фронтир-модели (эталон из четырех американских моделей); международный консенсус и открытые вопросы по evals (блог UK AISI, 2026-02)."
            - superscript [ref=f27e12195]:
              - link "↗" [ref=f27e12196] [cursor=pointer]:
