              - generic [ref=f5e735]:
                - generic [ref=f5e736]:
                  - heading "Mechanistic interpretability of jailbreak attacks" [level=3] [ref=f5e737]
                  - paragraph [ref=f5e738]:
                    - text: Battista Biggio
                    - generic [ref=f5e739]: · University of Cagliari, Italy
                  - paragraph [ref=f5e740]: Modern aligned language models refuse harmful requests, yet simple jailbreak prompts often restore unsafe behavior. This project investigates whether jailbreaks operate by manipulating the internal representations responsible for refusal. We will identify refusal-related directions or sparse features using representation analysis across multiple aligned models, compare how diverse jailbreak families alter these representations, and perform causal interventions through activation steering to test whether restoring refusal representations can prevent successful jailbreaks. The project aims to determine whether jailbreaks exploit a shared geometric mechanism or multiple distinct internal circuits, providing mechanistic insights into the robustness and limitations of current alignment methods.
                  - generic [ref=f5e741]:
                    - generic [ref=f5e742]: Mechanistic interpretability
                    - generic [ref=f5e747]: AI security
                - button "Add bookmark" [ref=f5e751]
