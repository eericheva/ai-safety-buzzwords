    - paragraph [ref=f9e5946]: "Citation source: Semantic Scholar Academic Graph API, an exact phrase key per topic, papers 2024-2026, snapshot 23 July 2026 (the numbers reproduce; the paper total and the per-year breakdown differ by up to 7 papers on 19 of the 53 rows, and on 17 of those 19 the year sum is the larger one - this is what index growth between calls looks like; a live re-check of five phrases had the range query exactly equal to the sum of the three yearly ones, so separate queries by themselves do not create the gap). Five verticals (medicine, transport, finance, energy, education) came from splitting the former Safety in verticals row and are counted by the same method, but the money is not yet split per vertical, which is why they sit in a separate money band. Money is an estimate of dedicated spend in dollars per year. Hover the amount in the \"money\" column (or a row in the chart) for the breakdown, where [S] is a named source with a figure (grant, RFP, round, acquisition) and [E] is my own read: usually industry spend inferred from team size (a dedicated team times the loaded cost of a researcher, roughly $0.5-1M a year), sometimes just an admission that no figure is published. Internal lab budgets are not disclosed, so industry is always [E] and the range is deliberately wide. The money layer has been checked figure by figure: all 48 amounts in the registry stand on a primary source with a verbatim quote - 30 held up as they were, 18 turned out to be wrong and have been corrected, and none is left unverifiable; a further 180 amounts were taken apart and kept out of the registry under a declared code. The narrative layer has now been through the same machine: of the 2453 quotes behind the cards and essays 2440 stand on their own page verbatim, and 13 pages cannot be read from here - bot protection or browser-side assembly, with no archived snapshot carrying the quote. Out of that a ledger of confirmed money was built: the confirmed by a source line in the tooltip shows how much money stands behind a direction in published documents, separately from my estimate. The money notes are no longer written by hand: every amount is a record with required fields (amount, period type, window, nature, share, source URL, verbatim quote), the note text is rendered from the records, and the [S] marker is computed - an amount becomes a source only once it has both a URL and a quote. Amount, period and share therefore live in the record and not in the prose, so the note cannot drift away from the figure it describes. The ledger excludes valuations, venture rounds, acquisition prices, compliance spend, parent-field budgets, whole-organisation budgets and anything announced but not disbursed; dividing a multi-year total by a term is allowed only when the term is published. The result: $50M a year awarded and confirmed plus $103M one-off and multi-year against $1173M of estimates; on top of that up to $34M announced in programme ceilings that have not been awarded yet - these are promised programme sizes, not money paid out, and they are not counted as confirmed. On 33 of the 53 rows there is no confirmed money at all, and those rows hold 65% of all the money on the map - their amount in the money column carries a °. For scale: this project's genealogy dataset adds up $764M of grants given out, and that is not a contradiction but a different question. There it is the whole history of the field since 2013, with no attribution to directions, no annual window and no rule for dividing a multi-year total by its term. Here it is one direction's dedicated spend for a year as published documents state it. The figure on the map is smaller not because the field has less money in it. Two earlier versions of this ledger said $84M and $143M: the rule for dividing a multi-year total by its term was applied unevenly, and more than half the annual sum rested on the map's own file with no URL and no quote. The required fields closed both holes. Money on this map is a weaker metric than citations: citations reproduce from a query, money does not, and a band is an estimate, not a measurement. 2026 is incomplete and depressed by indexing lag, so momentum is a lower bound. Narrow keys understate broad topics (dangerous capability evals, for instance). The cites/paper column is the citation sum over the hundred most-cited papers divided by the paper count, capped at a hundred. Because of that cap it systematically favours large corpora: a 30-paper direction is divided by 30, a 3000-paper direction is also divided by 100, and the numerator comes from the same hundred papers either way. Comparing rows by this column is only sound between rows of similar size.Markers next to a name: * the key is polysemous and the paper count is inflated by an adjacent sense (an upper bound on attention to the word, not clean safety relevance); ^ the key was narrowed to AI/safety and recounted downward; [f] the topic lives in forum essays and citation counts barely see it. Markers stack: 4 rows carry two at once, and each is read on its own. The markers follow the same logic as the 53-direction table in the text map, but the two lists have never been checked against each other row by row. The cards are not a registry: where a source enumerates a whole programme, the map takes it whole (all 22 ARIA Safeguarded AI TA1.1 projects, all 5 Anthropic Fellows areas); where it is a menu of proposals to choose from (Redwood's 33), the map takes the ones that fall into its directions. A card's description repeats its name when the source's page text says nothing beyond the name: for the ARIA TA1.1 projects the write-up lives only in a modal window assembled by a script and never reaches the page text, so it sits in the evidence note rather than in the description. English spelling follows the source, which is why British and American forms sit side by side: \"UK AI Security Institute programme\" next to \"Anthropic model welfare program\"."